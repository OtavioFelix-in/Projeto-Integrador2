<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Pronto Socorro - Médico</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="layout">

    <aside class="sidebar">
      <div class="logo">PRONTO<br>SOCORRO</div>
      <nav>
        <a href="medico.html" class="ativo">Painel</a>
      </nav>
      <button id="sair" class="botao-sair">Sair</button>
    </aside>

    <div class="conteudo">
      <header class="topo">
        <h1>Painel de Atendimentos</h1>
        <span id="nomeUsuario"></span>
      </header>

      <main>
        <section class="resumo">
          <div class="caixa card">
            <span class="card-titulo">Aguardando</span>
            <strong id="totalAguardando">0</strong>
            <span class="card-legenda">pacientes</span>
          </div>
          <div class="caixa card">
            <span class="card-titulo">Casos graves</span>
            <strong id="totalGraves">0</strong>
            <span class="card-legenda">vermelho + laranja</span>
          </div>
          <div class="caixa card">
            <span class="card-titulo">Espera média</span>
            <strong id="esperaMedia">0</strong>
            <span class="card-legenda">min desde a triagem</span>
          </div>
        </section>
        <button id="atualizar" class="botao-secundario">Atualizar</button>
        <table class="tabela">
          <thead>
            <tr>
              <th>Prioridade</th>
              <th>Número</th>
              <th>Paciente</th>
              <th>Idade</th>
              <th>Queixas</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="painel"></tbody>
        </table>

        <div id="consulta" class="caixa" hidden>
          <h2 id="tituloConsulta"></h2>

          <h3>Triagem</h3>
          <div class="sinais">
            <div class="sinal">
              <span class="card-titulo">Pressão</span>
              <strong id="sinalPressao"></strong>
            </div>
            <div class="sinal">
              <span class="card-titulo">Temperatura</span>
              <strong id="sinalTemperatura"></strong>
          </div>
          <div class="sinal">
              <span class="card-titulo">Batimentos</span>
              <strong id="sinalBatimentos"></strong>
            </div>
        </div>
        <p><strong>Queixas:</strong> <span id="sinalQueixas"></span></p>

        <h3>Medicações</h3>
        <table class="tabela">
          <thead>
            <tr>
              <th>Medicamentos</th>
              <th>Dosagem</th>
              <th>Frequência</th>
            </tr>
          </thead>
           <tbody id="prescricoes"></tbody>
        </table>

        <form id="formPrescricao" class="form-linha">
          <label>Medicamento
            <input type="text" id="medicamento" name="medicamento" required>
          </label>
          <label>Dosagem
            <input type="text" id="dosagem" name="dosagem" required>
          </label>
          <label>Frequência
            <input type="text" id="frequencia" name="frequencia" required>
          </label>
          <button type="submit" class="botao-secundario">Adicionar</button>
        </form>

        <h3>Confirmar consulta</h3>
        <form id="formConfirmar">
          <label>Diagnóstico
            <input type="text" id="diagnostico" maxlength="300" required>
          </label>
          <div class="acoes">
            <button type="button" id="fechar" class="botao botao-secundario">Fechar</button>
            <button type="submit" class="botao">Confirmar consulta</button>
          </div> 
        </form>





        </div>
        <p id="mensagem"></p>
      </main>
    </div>
  </div>



<script src="js/medico.js"></script>
</body>
</html>
