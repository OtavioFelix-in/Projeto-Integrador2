<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pronto Socorro - Triagem</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Triagem</h1>
  <p><span id="nomeUsuario"></span> <button id="sair">Sair</button></p>

  <h2>Pacientes aguardando triagem</h2>
  <button id="atualizar">Atualizar</button>
  <table>
    <thead>
      <tr>
        <th>Número</th>
        <th>Paciente</th>
        <th>Idade</th>
        <th>Entrada</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="fila"></tbody>
  </table>

  <form id="formTriagem" hidden>
    <h2 id="tituloTriagem"></h2>
    <input type="hidden" id="idAtendimento">

    <label>Pressão arterial (ex: 120/80)
      <input type="text" id="pressao_arterial" required>
    </label>
    <label>Temperatura (°C)
      <input type="number" id="temperatura" step="0.1" min="30" max="45" required>
    </label>
    <label>Batimentos cardíacos (bpm)
      <input type="number" id="batimentos_cardiacos" min="0" max="300" required>
    </label>
    <label>Principais queixas
      <input type="text" id="queixas" maxlength="255" required>
    </label>
    <label>Classificação de risco (Manchester)
      <select id="prioridade" required>
        <option value="">Selecione</option>
        <option value="1">Vermelho - Emergência</option>
        <option value="2">Laranja - Muito urgente</option>
        <option value="3">Amarelo - Urgente</option>
        <option value="4">Verde - Pouco urgente</option>
        <option value="5">Azul - Não urgente</option>
      </select>
    </label>

    <button type="submit">Salvar triagem</button>
    <button type="button" id="fechar">Fechar</button>
  </form>
  <p id="mensagem"></p>

  <script src="js/triagem.js"></script>
</body>
</html>
